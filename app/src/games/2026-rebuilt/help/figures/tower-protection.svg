<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" role="img" aria-label="With 24 seconds left, a red robot hits a blue robot that is climbing the blue tower. Major foul, and the blue robot gets Level 3.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;fill:#090b0c}
.l{font-size:17px;font-weight:600}
.s{font-size:15px;fill:#4b5b5f}
.num{font-size:13px;font-weight:700;letter-spacing:.6px}
.pill{font-size:16px;font-weight:700}

.red{animation:protection-red 2.8s 1 both ease-in}
.hit{animation:protection-hit 2.8s 1 both}
.blue{transform-origin:74px 160px;animation:protection-jolt 2.8s 1 both}
.foul{animation:protection-foul 2.8s 1 both}
@keyframes protection-red{0%{transform:translateX(240px)}50%,100%{transform:translateX(0)}}
@keyframes protection-hit{0%,48%{opacity:0}54%,100%{opacity:1}}
@keyframes protection-jolt{0%,50%{transform:rotate(0)}55%{transform:rotate(-4deg)}62%{transform:rotate(2deg)}70%,100%{transform:rotate(0)}}
@keyframes protection-foul{0%,62%{opacity:0}74%,100%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}#still:target,#still:target *{animation:none!important}</style>
<g id="still">
