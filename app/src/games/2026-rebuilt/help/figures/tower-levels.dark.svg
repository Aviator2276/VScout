<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" role="img" aria-label="Three towers seen from the front. Level 1: the robot is off the floor. Level 2: bumpers above the low rung. Level 3: bumpers above the mid rung.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;fill:#f5f7f7}
.l{font-size:17px;font-weight:600}
.s{font-size:15px;fill:#a8b4b7}
.num{font-size:13px;font-weight:700;letter-spacing:.6px}
.pill{font-size:16px;font-weight:700}

.r1{animation:levels-r1 3.6s 1 both ease-in-out}
.r2{animation:levels-r2 3.6s 1 both ease-in-out}
.r3{animation:levels-r3 3.6s 1 both ease-in-out}
@keyframes levels-r1{0%,10%{transform:translateY(14px)}38%,100%{transform:translateY(0)}}
@keyframes levels-r2{0%,22%{transform:translateY(56px)}62%,100%{transform:translateY(0)}}
@keyframes levels-r3{0%,34%{transform:translateY(92px)}84%,100%{transform:translateY(0)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}#still:target,#still:target *{animation:none!important}</style>
