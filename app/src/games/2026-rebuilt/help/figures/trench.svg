<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" role="img" aria-label="A 20-inch-tall robot drives under the trench, whose gap is 22.25 inches. A 30-inch robot can't fit.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;fill:#090b0c}
.l{font-size:17px;font-weight:600}
.s{font-size:15px;fill:#4b5b5f}
.num{font-size:13px;font-weight:700;letter-spacing:.6px}
.pill{font-size:16px;font-weight:700}

.short{animation:trench-short 3.2s 1 both ease-in-out}
.tall{animation:trench-tall 3.2s 1 both ease-out}
.bonk{animation:trench-bonk 3.2s 1 both}
.no{animation:trench-no 3.2s 1 both}
.yes{animation:trench-yes 3.2s 1 both}
@keyframes trench-short{0%{transform:translateX(-150px)}70%,100%{transform:translateX(0)}}
@keyframes trench-tall{0%{transform:translateX(-80px)}50%,100%{transform:translateX(0)}}
@keyframes trench-bonk{0%,48%{opacity:0}54%,100%{opacity:1}}
@keyframes trench-no{0%,56%{opacity:0}68%,100%{opacity:1}}
@keyframes trench-yes{0%,70%{opacity:0}80%,100%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}#still:target,#still:target *{animation:none!important}</style>
<g id="still">
<rect width="400" height="252" fill="#eef1f1"/>
<rect x="0" y="196" width="400" height="56" fill="#e0e4e4"/><line x1="200" y1="12" x2="200" y2="240" stroke="#80888a" stroke-width="1" opacity=".6"/><rect x="40" y="115.5" width="94.0" height="36.0" rx="3" fill="#b8bfc1" stroke="#80888a" stroke-width="1.5"/><rect x="260" y="115.5" width="94.0" height="36.0" rx="3" fill="#b8bfc1" stroke="#80888a" stroke-width="1.5"/><g class="short"><circle cx="153" cy="190.5" r="5.5" fill="#181b1c"/><circle cx="183" cy="190.5" r="5.5" fill="#181b1c"/><rect x="145" y="156.0" width="46" height="22.0" rx="4" fill="#292f32"/><rect x="140" y="178" width="56" height="12" rx="4" fill="#145ec1" stroke="#004296" stroke-width="1.5"/></g><line x1="48" y1="151.5" x2="48" y2="196" stroke="#b77610" stroke-width="2"/><path d="M43 151.5 h10 M43 196 h10" stroke="#b77610" stroke-width="2"/><text x="92" y="178.8" text-anchor="middle" class="s" style="fill:#7e4f04;font-weight:600">22.25 in</text><g class="tall"><circle cx="215" cy="190.5" r="5.5" fill="#181b1c"/><circle cx="245" cy="190.5" r="5.5" fill="#181b1c"/><rect x="207" y="136.0" width="46" height="42.0" rx="4" fill="#292f32"/><path d="M232.8 136.0 q11.200000000000001 -13 21.28 2" fill="none" stroke="#757c7f" stroke-width="3.5" stroke-linecap="round"/><rect x="202" y="178" width="56" height="12" rx="4" fill="#cf2845" stroke="#a1012c" stroke-width="1.5"/></g><g class="bonk"><circle cx="260" cy="157.5" r="6.5" fill="#b77610"/><line x1="269.2" y1="161.3" x2="276.6" y2="164.4" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="263.8" y1="166.7" x2="266.9" y2="174.1" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="256.2" y1="166.7" x2="253.1" y2="174.1" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="250.8" y1="161.3" x2="243.4" y2="164.4" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="250.8" y1="153.7" x2="243.4" y2="150.6" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="256.2" y1="148.3" x2="253.1" y2="140.9" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="263.8" y1="148.3" x2="266.9" y2="140.9" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="269.2" y1="153.7" x2="276.6" y2="150.6" stroke="#b77610" stroke-width="3" stroke-linecap="round"/></g><g class="yes"><rect x="25.5" y="210.0" width="149.0" height="32" rx="16" fill="#007e46"/><path d="M39.5 226 l4 4 l8 -9" fill="none" stroke="#f5fcf7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="111.0" y="231.5" text-anchor="middle" class="pill" style="fill:#f5fcf7">20 in: fits</text></g><g class="no"><rect x="207.5" y="210.0" width="185.0" height="32" rx="16" fill="#cc272e"/><path d="M222.5 221 l10 10 M232.5 221 l-10 10" stroke="#fff8f7" stroke-width="2.5" stroke-linecap="round"/><text x="311.0" y="231.5" text-anchor="middle" class="pill" style="fill:#fff8f7">30 in: too tall</text></g>
</g>
</svg>
