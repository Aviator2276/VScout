<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 282" role="img" aria-label="A red robot holds a blue robot against the wall. After a 3-second count, a minor foul is called.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;fill:#090b0c}
.l{font-size:17px;font-weight:600}
.s{font-size:15px;fill:#4b5b5f}
.num{font-size:13px;font-weight:700;letter-spacing:.6px}
.pill{font-size:16px;font-weight:700}

.red{animation:pinning-red 4.6s 1 both ease-out}
.ring{stroke-dasharray:276.5;animation:pinning-ring 4.6s 1 both linear}
.n1{opacity:0;animation:pinning-n1 4.6s 1 both}
.n2{opacity:0;animation:pinning-n2 4.6s 1 both}
.n3{animation:pinning-n3 4.6s 1 both}
.foul{animation:pinning-foul 4.6s 1 both}
@keyframes pinning-red{0%{transform:translate(0,120px)}17%,100%{transform:translate(0,0)}}
@keyframes pinning-ring{0%,17%{stroke-dashoffset:276.5}83%,100%{stroke-dashoffset:0}}
@keyframes pinning-n1{0%,17%{opacity:0}18%,39%{opacity:1}40%,100%{opacity:0}}
@keyframes pinning-n2{0%,39%{opacity:0}40%,61%{opacity:1}62%,100%{opacity:0}}
@keyframes pinning-n3{0%,61%{opacity:0}62%,100%{opacity:1}}
@keyframes pinning-foul{0%,83%{opacity:0}88%,100%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}#still:target,#still:target *{animation:none!important}</style>
<g id="still">
<rect width="400" height="282" fill="#eef1f1"/>
<rect x="0" y="0" width="400" height="14" fill="#b8bfc1" stroke="#80888a" stroke-width="1"/><text x="384" y="38" text-anchor="end" class="s">Field wall</text><rect x="40" y="14" width="110" height="110" rx="14" fill="#145ec1" stroke="#004296" stroke-width="1.5"/><rect x="58" y="32" width="74" height="74" rx="6" fill="#292f32"/><rect x="63" y="37" width="14" height="14" rx="3" fill="#53595d"/><rect x="63" y="87" width="14" height="14" rx="3" fill="#53595d"/><rect x="113" y="37" width="14" height="14" rx="3" fill="#53595d"/><rect x="113" y="87" width="14" height="14" rx="3" fill="#53595d"/><rect x="81.0" y="59.0" width="28" height="20" rx="4" fill="#53595d" opacity=".6"/><text x="95.0" y="119.5" text-anchor="middle" class="num" style="fill:#f6faff">BLUE</text><g class="red"><rect x="40" y="124" width="110" height="110" rx="14" fill="#cf2845" stroke="#a1012c" stroke-width="1.5"/><rect x="58" y="142" width="74" height="74" rx="6" fill="#292f32"/><rect x="63" y="147" width="14" height="14" rx="3" fill="#53595d"/><rect x="63" y="197" width="14" height="14" rx="3" fill="#53595d"/><rect x="113" y="147" width="14" height="14" rx="3" fill="#53595d"/><rect x="113" y="197" width="14" height="14" rx="3" fill="#53595d"/><rect x="81.0" y="169.0" width="28" height="20" rx="4" fill="#53595d" opacity=".6"/><text x="95.0" y="229.5" text-anchor="middle" class="num" style="fill:#fff8f7">RED</text><path d="M95 266 v-18 m-8 8 l8 -8 l8 8" fill="none" stroke="#4b5b5f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="290" cy="96" r="44" fill="none" stroke="#c3c8c9" stroke-width="9"/><circle class="ring" cx="290" cy="96" r="44" fill="none" stroke="#b77610" stroke-width="9" stroke-linecap="round" transform="rotate(-90 290 96)"/><text class="n1" x="290" y="109" text-anchor="middle" style="font-size:38px;font-weight:700">1</text><text class="n2" x="290" y="109" text-anchor="middle" style="font-size:38px;font-weight:700">2</text><text class="n3" x="290" y="109" text-anchor="middle" style="font-size:38px;font-weight:700">3</text><text x="290" y="166" text-anchor="middle" class="s">Seconds pinned</text><g class="foul"><g class=""><rect x="220.0" y="190.0" width="140.0" height="32" rx="16" fill="#f7b83d" stroke="#b77610" stroke-width="1.5"/><path d="M235.0 214 v-17 h11 l-3 4 l3 4 h-11" fill="#1f1401" stroke="#1f1401" stroke-width="1.5" stroke-linejoin="round"/><text x="301.0" y="211.5" text-anchor="middle" class="pill" style="fill:#1f1401">Minor foul</text></g><text x="290" y="242" text-anchor="middle" class="s">then a major foul</text><text x="290" y="262" text-anchor="middle" class="s">every 3 s after</text></g>
</g>
</svg>
