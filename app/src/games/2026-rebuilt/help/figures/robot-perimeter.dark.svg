<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img" aria-label="A red robot's arm reaches over a blue robot's bumper into its frame. Minor foul.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;fill:#f5f7f7}
.l{font-size:17px;font-weight:600}
.s{font-size:15px;fill:#a8b4b7}
.num{font-size:13px;font-weight:700;letter-spacing:.6px}
.pill{font-size:16px;font-weight:700}

.arm{transform-origin:108px 115px;animation:perimeter-arm 2.6s 1 both ease-out}
.hit{animation:perimeter-hit 2.6s 1 both}
.foul{animation:perimeter-foul 2.6s 1 both}
@keyframes perimeter-arm{0%,15%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
@keyframes perimeter-hit{0%,58%{opacity:0}64%{opacity:1}100%{opacity:.85}}
@keyframes perimeter-foul{0%,66%{opacity:0}78%,100%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}#still:target,#still:target *{animation:none!important}</style>
<g id="still">
<rect width="400" height="236" fill="#121719"/>
<rect x="250" y="60" width="110" height="110" rx="14" fill="#5fa1f3" stroke="#2460b7" stroke-width="1.5"/><rect x="268" y="78" width="74" height="74" rx="6" fill="#33393c"/><rect x="273" y="83" width="14" height="14" rx="3" fill="#5e6468"/><rect x="273" y="133" width="14" height="14" rx="3" fill="#5e6468"/><rect x="323" y="83" width="14" height="14" rx="3" fill="#5e6468"/><rect x="323" y="133" width="14" height="14" rx="3" fill="#5e6468"/><rect x="291.0" y="105.0" width="28" height="20" rx="4" fill="#5e6468" opacity=".6"/><text x="305.0" y="165.5" text-anchor="middle" class="num" style="fill:#030d1e">BLUE</text><rect x="268" y="78" width="74" height="74" rx="6" fill="none" stroke="#f4cd4b" stroke-width="2.5" stroke-dasharray="7 5"/><text x="305" y="42" text-anchor="middle" class="s" style="fill:#f4cd4b;font-weight:600">Blue&#8217;s frame perimeter</text><rect x="16" y="60" width="110" height="110" rx="14" fill="#f75b6b" stroke="#af283d" stroke-width="1.5"/><rect x="34" y="78" width="74" height="74" rx="6" fill="#33393c"/><rect x="39" y="83" width="14" height="14" rx="3" fill="#5e6468"/><rect x="39" y="133" width="14" height="14" rx="3" fill="#5e6468"/><rect x="89" y="83" width="14" height="14" rx="3" fill="#5e6468"/><rect x="89" y="133" width="14" height="14" rx="3" fill="#5e6468"/><rect x="57.0" y="105.0" width="28" height="20" rx="4" fill="#5e6468" opacity=".6"/><text x="71.0" y="165.5" text-anchor="middle" class="num" style="fill:#1b0607">RED</text><g class="arm"><rect x="100" y="108" width="190" height="14" rx="4" fill="#b8bfc3"/><rect x="280" y="94" width="14" height="42" rx="5" fill="#b8bfc3" stroke="#6b7376" stroke-width="1.5"/></g><circle class="hit" cx="287" cy="115" r="20" fill="#f7b83d" opacity=".85"/><g class="foul"><rect x="130.0" y="192.0" width="140.0" height="32" rx="16" fill="#f7b83d" stroke="#f7b83d" stroke-width="1.5"/><path d="M145.0 216 v-17 h11 l-3 4 l3 4 h-11" fill="#1f1401" stroke="#1f1401" stroke-width="1.5" stroke-linejoin="round"/><text x="211.0" y="213.5" text-anchor="middle" class="pill" style="fill:#1f1401">Minor foul</text></g>
</g>
</svg>
