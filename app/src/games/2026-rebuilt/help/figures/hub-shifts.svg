<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 226" role="img" aria-label="Match timeline: both hubs active in auto, the transition shift and end game. In shifts 1 to 4, blue's hub is active in 1 and 3 and red's in 2 and 4, because red scored more in auto.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;fill:#090b0c}
.l{font-size:17px;font-weight:600}
.s{font-size:15px;fill:#4b5b5f}
.num{font-size:13px;font-weight:700;letter-spacing:.6px}
.pill{font-size:16px;font-weight:700}

.head{opacity:0;animation:shifts-head 8s 1 linear both}
@keyframes shifts-head{0%{opacity:0;transform:translateX(0)}3%{opacity:1}94%{opacity:1;transform:translateX(318px)}100%{opacity:0;transform:translateX(318px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}#still:target,#still:target *{animation:none!important}</style>
<g id="still">
<rect width="400" height="226" fill="#eef1f1"/>
<text x="16" y="24" class="s">Example: red scored more in auto</text><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#dbdfdf"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c3c8c9" stroke-width="4"/></pattern></defs><text x="16" y="64" class="l">Red</text><rect x="67.5" y="38" width="36.8" height="40" rx="6" fill="#cf2845"/><rect x="107.2" y="38" width="16.9" height="40" rx="6" fill="#cf2845"/><rect x="127.1" y="38" width="46.7" height="40" rx="6" fill="url(#hatch)"/><text x="150.5" y="63" text-anchor="middle" class="s">off</text><rect x="176.8" y="38" width="46.7" height="40" rx="6" fill="#cf2845"/><rect x="226.5" y="38" width="46.7" height="40" rx="6" fill="url(#hatch)"/><text x="249.8" y="63" text-anchor="middle" class="s">off</text><rect x="276.2" y="38" width="46.7" height="40" rx="6" fill="#cf2845"/><rect x="325.9" y="38" width="56.6" height="40" rx="6" fill="#cf2845"/><text x="16" y="114" class="l">Blue</text><rect x="67.5" y="88" width="36.8" height="40" rx="6" fill="#145ec1"/><rect x="107.2" y="88" width="16.9" height="40" rx="6" fill="#145ec1"/><rect x="127.1" y="88" width="46.7" height="40" rx="6" fill="#145ec1"/><rect x="176.8" y="88" width="46.7" height="40" rx="6" fill="url(#hatch)"/><text x="200.2" y="113" text-anchor="middle" class="s">off</text><rect x="226.5" y="88" width="46.7" height="40" rx="6" fill="#145ec1"/><rect x="276.2" y="88" width="46.7" height="40" rx="6" fill="url(#hatch)"/><text x="299.5" y="113" text-anchor="middle" class="s">off</text><rect x="325.9" y="88" width="56.6" height="40" rx="6" fill="#145ec1"/><text x="85.9" y="152" text-anchor="middle" class="s" style="fill:#090b0c">Auto</text><text x="115.7" y="152" text-anchor="middle" class="s" style="fill:#090b0c">T</text><text x="150.5" y="152" text-anchor="middle" class="s" style="fill:#090b0c">1</text><text x="200.2" y="152" text-anchor="middle" class="s" style="fill:#090b0c">2</text><text x="249.8" y="152" text-anchor="middle" class="s" style="fill:#090b0c">3</text><text x="299.5" y="152" text-anchor="middle" class="s" style="fill:#090b0c">4</text><text x="354.2" y="152" text-anchor="middle" class="s" style="fill:#090b0c">End</text><text x="225.0" y="174" text-anchor="middle" class="s">Shifts 1&#8211;4: 25 s each</text><g class="head"><rect x="64.5" y="30" width="3" height="104" rx="1.5" fill="#090b0c"/></g><rect x="16" y="196" width="22" height="16" rx="4" fill="#cf2845"/><rect x="27" y="196" width="11" height="16" fill="#145ec1"/><text x="46" y="209" class="s">Active</text><rect x="124" y="196" width="22" height="16" rx="4" fill="url(#hatch)" stroke="#80888a" stroke-width="1"/><text x="154" y="209" class="s">Inactive (fuel scores 0)</text>
</g>
</svg>
