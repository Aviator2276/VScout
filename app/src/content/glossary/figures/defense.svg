<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="A red robot drives into a blue robot bumper to bumper and pushes it off its path. Legal.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;fill:#090b0c}
.l{font-size:17px;font-weight:600}
.s{font-size:15px;fill:#4b5b5f}
.num{font-size:13px;font-weight:700;letter-spacing:.6px}
.pill{font-size:16px;font-weight:700}

.blue{animation:defense-blue 3.2s 1 both ease-in-out}
.red{animation:defense-red 3.2s 1 both ease-in-out}
.spark{animation:defense-spark 3.2s 1 both}
.ok{animation:defense-ok 3.2s 1 both}
@keyframes defense-blue{0%{transform:translate(-170px,0)}48%{transform:translate(0,0)}72%,100%{transform:translate(22px,-20px)}}
@keyframes defense-red{0%{transform:translate(0,140px)}48%{transform:translate(0,0)}72%,100%{transform:translate(22px,-20px)}}
@keyframes defense-spark{0%,46%{opacity:0}52%,100%{opacity:1}}
@keyframes defense-ok{0%,64%{opacity:0}76%,100%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}#still:target,#still:target *{animation:none!important}</style>
<g id="still">
<rect width="400" height="270" fill="#eef1f1"/>
<line x1="16" y1="110" x2="372" y2="110" stroke="#80888a" stroke-width="2" stroke-dasharray="7 7"/><path d="M372 103 l12 7 l-12 7 z" fill="#80888a"/><text x="384" y="96" text-anchor="end" class="s">Blue&#8217;s path</text><g class="blue"><rect x="150" y="55" width="110" height="110" rx="14" fill="#145ec1" stroke="#004296" stroke-width="1.5"/><rect x="168" y="73" width="74" height="74" rx="6" fill="#292f32"/><rect x="173" y="78" width="14" height="14" rx="3" fill="#53595d"/><rect x="173" y="128" width="14" height="14" rx="3" fill="#53595d"/><rect x="223" y="78" width="14" height="14" rx="3" fill="#53595d"/><rect x="223" y="128" width="14" height="14" rx="3" fill="#53595d"/><rect x="191.0" y="100.0" width="28" height="20" rx="4" fill="#53595d" opacity=".6"/><text x="205.0" y="160.5" text-anchor="middle" class="num" style="fill:#f6faff">BLUE</text></g><g class="red"><rect x="165" y="165" width="110" height="110" rx="14" fill="#cf2845" stroke="#a1012c" stroke-width="1.5"/><rect x="183" y="183" width="74" height="74" rx="6" fill="#292f32"/><rect x="188" y="188" width="14" height="14" rx="3" fill="#53595d"/><rect x="188" y="238" width="14" height="14" rx="3" fill="#53595d"/><rect x="238" y="188" width="14" height="14" rx="3" fill="#53595d"/><rect x="238" y="238" width="14" height="14" rx="3" fill="#53595d"/><rect x="206.0" y="210.0" width="28" height="20" rx="4" fill="#53595d" opacity=".6"/><text x="220.0" y="270.5" text-anchor="middle" class="num" style="fill:#fff8f7">RED</text><g class="spark"><circle cx="252" cy="165" r="6.5" fill="#b77610"/><line x1="261.2" y1="168.8" x2="268.6" y2="171.9" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="255.8" y1="174.2" x2="258.9" y2="181.6" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="248.2" y1="174.2" x2="245.1" y2="181.6" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="242.8" y1="168.8" x2="235.4" y2="171.9" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="242.8" y1="161.2" x2="235.4" y2="158.1" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="248.2" y1="155.8" x2="245.1" y2="148.4" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="255.8" y1="155.8" x2="258.9" y2="148.4" stroke="#b77610" stroke-width="3" stroke-linecap="round"/><line x1="261.2" y1="161.2" x2="268.6" y2="158.1" stroke="#b77610" stroke-width="3" stroke-linecap="round"/></g></g><g class="ok"><rect x="287.5" y="14.0" width="95.0" height="32" rx="16" fill="#007e46"/><path d="M301.5 30 l4 4 l8 -9" fill="none" stroke="#f5fcf7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="346.0" y="35.5" text-anchor="middle" class="pill" style="fill:#f5fcf7">Legal</text></g>
</g>
</svg>
