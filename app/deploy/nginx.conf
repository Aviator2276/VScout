# VScout static host (PV-1, pwa-offline.md §5). Serves app/dist/client.
# Install as a server block; TLS terminates here or at a proxy in front (the app needs HTTPS).
# Deploy order: rsync assets/ first (no --delete; prune files older than 7 days with cron),
# then everything else, then sw.js last.
server {
  listen 80;
  server_name _;
  root /srv/vscout;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Byte-compared by the browser on every update check
  location = /sw.js {
    include /etc/nginx/vscout/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Must always reflect the live deploy
  location = /version.json {
    include /etc/nginx/vscout/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/vscout/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    types { }
    default_type application/manifest+json;
  }

  # Content-hashed; a missing chunk must be a real 404, never index.html
  location /assets/ {
    include /etc/nginx/vscout/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /icons/ {
    include /etc/nginx/vscout/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # SPA: every other path gets the shell with status 200
  location / {
    include /etc/nginx/vscout/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
